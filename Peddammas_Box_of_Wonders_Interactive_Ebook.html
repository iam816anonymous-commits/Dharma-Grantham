:root{--ink:#26305f;--gold:#b8892f;--gold2:#d9bd7c;--cream:#fff8e9;--paper:#fffdf6;--clay:#c4552f;--green:#4f9a3a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Lora',serif;-webkit-tap-highlight-color:transparent}
.te{font-family:'NotoSerifTe','Lora',serif}
.lang-en .te{display:none!important}.lang-te .en{display:none!important}
button{font-family:inherit;cursor:pointer}
#app{min-height:100vh;display:flex;flex-direction:column;background:
 radial-gradient(circle at 12% 8%,rgba(217,189,124,.28),transparent 40%),radial-gradient(circle at 92% 90%,rgba(196,85,47,.12),transparent 42%),var(--cream)}
/* top bar */
#bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;background:rgba(255,248,233,.92);backdrop-filter:blur(6px);border-bottom:1px solid #ecdcb2}
.brand{display:flex;align-items:center;gap:8px;font:700 20px 'Cormorant',serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.brand .te{font:700 16px 'NotoSerifTe'}
.brand svg{width:30px;height:30px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tb{flex:none;background:#fff;color:var(--ink);border:1px solid var(--gold2);border-radius:999px;padding:7px 13px;font:600 13px 'Lora';white-space:nowrap}
.tb .te{font:600 13px 'NotoSerifTe'}.tb:hover,.tb.on{background:var(--ink);color:#fff3d2;border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--gold2);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 14px;font:600 13px 'Lora';color:var(--ink)}
.seg button[data-lang=te]{font:600 14px 'NotoSerifTe'}.seg button.on{background:var(--ink);color:#fff3d2}
/* stage */
#stage{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:18px 16px 120px}
.scr{display:none}.scr.on{display:block;animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}
.kick{font:700 12px 'Lora';letter-spacing:.18em;text-transform:uppercase;color:#8a6a24}.kick .te{font:700 13px 'NotoSerifTe';letter-spacing:0;text-transform:none}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--clay);color:#fff;border:0;border-radius:999px;padding:13px 26px;font:700 16px 'Lora';box-shadow:0 6px 18px rgba(196,85,47,.35);transition:transform .15s}
.cta .te{font:700 16px 'NotoSerifTe'}.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--gold2);box-shadow:none}
.card{background:var(--paper);border:1px solid #ecdcb2;border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(120,80,20,.08);position:relative}
/* cover */
.cover{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center;min-height:62vh}
.cover .art{background:linear-gradient(160deg,#fde9b8,#f6c9a0 60%,#e9a97d);border-radius:26px;padding:20px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(120,60,20,.25)}
.cover .art svg.tr{width:100%;display:block}
.cover .art .pd{position:absolute;right:-6px;bottom:-14px;width:36%}
.cover h1{font:700 clamp(38px,6vw,68px)/1 'Cormorant',serif;color:var(--ink);margin:8px 0 6px}
.cover h1.te{font:700 clamp(30px,5vw,52px)/1.3 'NotoSerifTe'}
.cover .tag{font:italic 500 clamp(22px,3vw,30px) 'Cormorant';color:var(--clay);margin:0 0 12px}.cover .tag.te{font:600 20px 'NotoSerifTe';font-style:normal}
.cover p.lead{font-size:18px;line-height:1.65;margin:0 0 20px}.cover p.lead.te{font-size:16.5px;line-height:1.95}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{background:#fff;border:1px solid var(--gold2);border-radius:999px;padding:6px 13px;font:600 12.5px 'Lora'}.chip .te{font:600 12.5px 'NotoSerifTe'}
/* meet */
.meet{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;align-items:center}
.meet .pic{background:linear-gradient(160deg,#fde9b8,#f6c9a0);border-radius:26px;padding:20px 20px 0;overflow:hidden;position:relative}
.meet .pic svg{width:100%;display:block}
.bubble{position:relative;background:#fff;border:1.5px solid var(--gold2);border-radius:18px;padding:14px 18px;font:italic 500 21px/1.4 'Cormorant';margin-bottom:14px}.bubble .te{font:500 15.5px/1.85 'NotoSerifTe';font-style:normal}
.meet h2{font:700 clamp(30px,4vw,44px)/1.1 'Cormorant';margin:6px 0 12px}.meet h2.te{font:700 clamp(26px,3.6vw,36px)/1.35 'NotoSerifTe'}
.meet p.body{font-size:18px;line-height:1.7;margin:0 0 14px}.meet p.body.te{font-size:16.5px;line-height:2}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 20px}
.st5{background:#fff;border:1px solid #ecdcb2;border-radius:14px;padding:12px 8px;text-align:center;font-size:13px;line-height:1.35}.st5 .te{font-size:12.5px;line-height:1.6}
.st5 b{display:flex;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:var(--ink);color:#ffe9a8;align-items:center;justify-content:center;font:700 16px 'Cormorant'}
/* story */
.story{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:stretch}
.story .art{border-radius:26px;padding:18px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px;box-shadow:0 14px 36px rgba(60,40,10,.2)}
.story .art .obj{width:min(78%,340px);filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(1.2deg)}}
.story .art .pd{position:absolute;left:8px;bottom:-10px;width:26%;max-width:120px}
.story .art .nm{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font:700 12px 'Lora';letter-spacing:.14em;text-transform:uppercase;color:rgba(38,48,95,.8)}.story .art .nm .te{font:700 13px 'NotoSerifTe';letter-spacing:0;text-transform:none}
.story .art.dark .nm{color:#ffe9a8}
.mote{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff3b0;opacity:.7;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}
.story h2{font:700 clamp(30px,4vw,44px)/1.1 'Cormorant';margin:6px 0 14px}.story h2.te{font:700 clamp(26px,3.5vw,36px)/1.35 'NotoSerifTe'}
.story .body{font-size:19px;line-height:1.75;margin:0 0 18px}.story .body.te{font-size:17px;line-height:2.05}
.story .body.en:first-letter{font:700 3.2em/.8 'Cormorant';float:left;color:var(--gold);padding:6px 9px 0 0}
.think{background:#fff1c9;border:1.5px solid var(--gold);border-radius:16px;padding:14px 18px;margin-bottom:20px;position:relative}
.think b{display:block;font:700 11.5px 'Lora';letter-spacing:.18em;text-transform:uppercase;color:#8a6a24;margin-bottom:4px}.think b .te{font:700 13.5px 'NotoSerifTe';letter-spacing:0;text-transform:none}
.think p{margin:0;font:italic 600 21px/1.4 'Cormorant'}.think p.te{font:600 16px/1.85 'NotoSerifTe';font-style:normal}
/* turn */
.thead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.thead .ob{width:60px;height:60px;flex:none;background:#fff;border-radius:50%;border:1.5px solid var(--gold2);padding:6px}
.thead h2{font:700 clamp(26px,3.6vw,38px)/1.1 'Cormorant'}.thead h2.te{font:700 clamp(22px,3.2vw,30px)/1.35 'NotoSerifTe'}
.turn .grid{display:grid;grid-template-columns:1fr;gap:16px}
.step{padding:18px 20px 18px 64px}
.step .n{position:absolute;left:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#ffe9a8;display:flex;align-items:center;justify-content:center;font:700 20px 'Cormorant'}
.step h3{font:700 24px 'Cormorant';margin-bottom:2px}.step h3.te{font:700 18px 'NotoSerifTe'}
.step p{margin:0 0 10px;font-size:17px;line-height:1.55}.step p.te{font-size:15.5px;line-height:1.9}
.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d8c79a;padding:0}.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sep{width:1px;height:26px;background:#e6d6a8;margin:0 4px}
.tool{background:#fff;border:1.2px solid var(--gold2);border-radius:10px;padding:6px 11px;font:600 13px 'Lora';color:var(--ink)}.tool .te{font:600 13px 'NotoSerifTe'}
.tool.on{background:var(--ink);color:#fff3d2;border-color:var(--ink)}
.dot{display:inline-block;border-radius:50%;background:currentColor;vertical-align:middle}
.cvwrap{position:relative;width:100%;aspect-ratio:800/560;background:#fff;border:2px solid var(--gold2);border-radius:14px;overflow:hidden;background-image:linear-gradient(#f4ecd4 1px,transparent 1px),linear-gradient(90deg,#f4ecd4 1px,transparent 1px);background-size:32px 32px}
.cvwrap .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.17;pointer-events:none;transition:opacity .3s}
.cvwrap .ghost svg{height:78%;width:auto}
.cvwrap.noghost .ghost{opacity:0}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
textarea{width:100%;min-height:150px;border:2px solid var(--gold2);border-radius:14px;padding:14px;font:500 17px/1.6 'Lora',serif;color:var(--ink);background:#fff;resize:vertical}
textarea:focus{outline:3px solid rgba(184,137,47,.35)}
textarea.te{font:500 16px/1.95 'NotoSerifTe',serif}
.save{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.status{font:italic 600 15px 'Lora';color:var(--green)}
/* gallery */
.gal h2,.fin h2{font:700 clamp(32px,4.5vw,48px)/1.1 'Cormorant'}.gal h2.te,.fin h2.te{font:700 clamp(26px,4vw,38px)/1.35 'NotoSerifTe'}
.gal .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px}
.gal figure{margin:0;background:var(--paper);border:1px solid #ecdcb2;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(120,80,20,.08)}
.gal figure img{display:block;width:100%;aspect-ratio:600/420;object-fit:contain;background:#fff}
.gal figcaption{padding:12px 14px}.gal figcaption b{font:700 18px 'Cormorant'}.gal figcaption b.te{font:700 15px 'NotoSerifTe'}
.gal figcaption p{margin:4px 0 8px;font-size:14px;line-height:1.5;max-height:6.5em;overflow:auto}.gal figcaption p.te{font-size:13.5px;line-height:1.8}
.gal .lock{display:flex;align-items:center;justify-content:center;aspect-ratio:600/420;background:#f6ecd0;color:#8a6a24}.gal .lock svg{height:60%;opacity:.28;filter:grayscale(1)}
.gal figure.empty{opacity:.75}
.dl{background:#fff;border:1px solid var(--gold2);border-radius:999px;padding:5px 12px;font:600 12.5px 'Lora';color:var(--ink)}.dl .te{font:600 12.5px 'NotoSerifTe'}
.fin{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;align-items:start}
.fin .pic{background:linear-gradient(160deg,#fde9b8,#f6c9a0);border-radius:26px;padding:20px 20px 0;overflow:hidden}.fin .pic svg{width:100%;display:block}
.note{background:#fff;border:1.5px dashed var(--gold);border-radius:14px;padding:16px 18px;margin:14px 0;font:italic 500 22px/1.45 'Cormorant'}.note .te{font:500 16.5px/1.95 'NotoSerifTe';font-style:normal}
.cert{border:6px double var(--gold);border-radius:14px;padding:22px 20px;text-align:center;background:linear-gradient(#fffdf6,#fdf1d0);margin:16px 0}
.cert .ct{font:700 12px 'Lora';letter-spacing:.3em;text-transform:uppercase;color:#8a6a24}.cert .ct .te{font:700 14px 'NotoSerifTe';letter-spacing:0;text-transform:none}
.cert h3{font:700 36px/1.1 'Cormorant';margin:6px 0}.cert h3.te{font:700 28px/1.4 'NotoSerifTe'}
.cert input{border:0;border-bottom:2px solid var(--gold);background:transparent;text-align:center;font:700 28px 'Cormorant';color:var(--ink);width:80%;max-width:360px;padding:4px}
.cert p{margin:8px 0 0;font-size:15px;line-height:1.6}.cert p.te{font-size:14.5px;line-height:1.9}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
/* image mode */
.fbsvg{display:contents}
.pimg.cut{mix-blend-mode:multiply;object-fit:contain;display:block}
.pimg.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.art.hasimg .obj,.art.hasimg .pd,.art.hasimg .mote,.art.hasimg>svg.tr,.pic.hasimg .cut{display:none}
.art.hasimg{padding:0}
.art.hasimg .nm{z-index:2;left:12px;right:12px}.art.hasimg .nm span{background:rgba(255,248,233,.9);color:var(--ink);padding:5px 11px;border-radius:999px}
.cover .art.hasimg{aspect-ratio:4/3}.story .art.hasimg{aspect-ratio:4/5;min-height:0}
.pic{position:relative}.fin .pic.hasimg{aspect-ratio:4/5;padding:0}
.sl .pimg,.thead .ob .pimg{width:100%;height:100%}.ghost .pimg{height:78%;width:auto}.lock .pimg{height:60%;opacity:.28;filter:grayscale(1)}
.story .art .obj .pimg{width:100%}.meet .pic .pimg,.fin .pic .cut{width:100%}.cover .art .pd .pimg,.story .art .pd .pimg{width:100%}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,248,233,.96);backdrop-filter:blur(6px);border-top:1px solid #ecdcb2;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
#nav .nb{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold2);background:#fff;font-size:24px;color:var(--ink)}
#nav .nb:hover:not(:disabled){background:var(--ink);color:#fff3d2}#nav .nb:disabled{opacity:.3;cursor:default}
#shelf{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;overflow-x:auto;padding:2px 4px}
.sl{flex:none;width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid #e6d6a8;padding:4px;position:relative;opacity:.55;filter:grayscale(.9)}
.sl svg{width:100%;height:100%}.sl.done{opacity:1;filter:none;border-color:var(--gold);background:#fff1c9}
.sl.done::after{content:"★";position:absolute;top:-7px;right:-5px;font-size:15px;color:var(--gold);text-shadow:0 0 3px #fff}
.sl.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
#count{font:700 13px 'Lora';color:#8a6a24;white-space:nowrap;margin:0 4px}
/* drawer & toast */
#drawer{position:fixed;top:56px;right:0;bottom:0;width:min(420px,94vw);background:#fffdf6;z-index:60;transform:translateX(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1);padding:22px 24px 80px;overflow:auto;box-shadow:-18px 0 50px rgba(0,0,0,.25);border-left:3px solid var(--gold)}
#drawer.open{transform:none}
#dclose{position:absolute;top:8px;right:12px;border:0;background:none;font-size:30px;color:#8a6a24}
#dbody h3{font:700 26px 'Cormorant';margin:0 0 4px}#dbody h3.te{font:700 20px 'NotoSerifTe'}
#dbody .kk{font:700 11px 'Lora';letter-spacing:.2em;text-transform:uppercase;color:#8a6a24;margin:16px 0 6px}#dbody .kk.te{font:700 13px 'NotoSerifTe';letter-spacing:0;text-transform:none}
#dbody li,#dbody p{font-size:16px;line-height:1.55}#dbody li.te,#dbody p.te{font-size:15px;line-height:1.9}#dbody ul{padding-left:20px;margin:0}
#dbody .act{background:#fff1c9;border:1.2px solid var(--gold);border-radius:10px;padding:10px 14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,30px);background:var(--ink);color:#ffe9a8;border-radius:14px;padding:12px 20px;font:600 15px 'Lora';opacity:0;pointer-events:none;transition:all .4s;z-index:120;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;pointer-events:none;z-index:200;font-size:18px;animation:spark 1.1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(240deg);opacity:0}}
/* splash */
#splash{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fde9b8,#f6c9a0 55%,#e9a97d);transition:opacity .7s,visibility .7s;padding:20px;overflow:auto}
#splash.gone{opacity:0;visibility:hidden}
#splash .sc{max-width:560px}
#splash svg.tr{width:min(70vw,300px);display:block;margin:0 auto 6px;animation:bob 5s ease-in-out infinite}
#splash h1{font:700 clamp(38px,8vw,64px)/1 'Cormorant';margin:4px 0}#splash h1.t{font:700 clamp(26px,5vw,40px)/1.35 'NotoSerifTe';color:#8c2a1a}
#splash p{font:italic 500 20px 'Cormorant';margin:6px 0 16px}
.sb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sb button{background:var(--ink);color:#fff3d2;border:0;border-radius:999px;padding:14px 28px;font:700 17px 'Lora';box-shadow:0 8px 24px rgba(38,48,95,.35)}
.sb button[data-start=te]{font:700 18px 'NotoSerifTe'}
#cont{margin-top:14px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:9px 20px;font:600 14px 'Lora'}
/* print */
body.printing #bar,body.printing #nav,body.printing #drawer,body.printing #toast,body.printing #splash,body.printing .noprint{display:none!important}
body.printing .scr:not(.printme){display:none!important}
body.printing .scr.printme{display:block!important;animation:none}
body.printing{background:#fff}
@media print{#app{background:#fff}.card,figure{break-inside:avoid}}
@media (max-width:820px){
 .cover,.meet,.story,.fin{grid-template-columns:1fr}.story .art{min-height:300px}.steps5{grid-template-columns:repeat(2,1fr)}
 .step{padding:16px 14px 16px 14px}.step .n{position:static;margin-bottom:6px}
 .brand{font-size:17px}.tb{padding:6px 10px;font-size:12px}#stage{padding:14px 12px 110px}
 .sl{width:34px;height:34px}.nbTxt{display:none}#bar{position:static}#drawer{top:0;z-index:70}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{t:['The Humming Lota','మంత్రం పాడిన చెంబు'],o:['Brass lota','ఇత్తడి చెంబు'],
 s:['When Peddamma lifted the lid of her old wooden trunk, a shiny brass lota winked in the lamplight. Little Chinnu tapped it — ting! — and the lota hummed a soft tune, as if it were thinking. “This lota hums only when it hears a good idea,” smiled Peddamma. “Long ago it carried water from the well. But a lota can carry so much more…” Chinnu tapped again. Ting! And the lota began to glow.',
    'పెద్దమ్మ తన పాత చెక్క పెట్టె మూత తెరవగానే, దీపం వెలుగులో ఒక మెరిసే ఇత్తడి చెంబు కన్నుగీటింది. చిన్ను దాన్ని చిన్నగా తట్టాడు — టింగ్! — ఆ చెంబు ఏదో ఆలోచిస్తున్నట్టు మెల్లగా మోగింది. “మంచి ఆలోచన వినిపిస్తేనే ఈ చెంబు పాడుతుంది,” అంది పెద్దమ్మ నవ్వుతూ. “పూర్వం ఇది బావి నుండి నీళ్లు మోసేది. కానీ ఒక చెంబు ఇంకెన్నో మోయగలదు…” చిన్ను మళ్లీ తట్టాడు. టింగ్! చెంబు మెరిసిపోవడం మొదలుపెట్టింది.'],
 q:['What could a magic lota carry besides water?','నీళ్లు కాకుండా ఒక మాయా చెంబు ఇంకా ఏమి మోయగలదు?'],
 d:['Draw what comes out of the glowing lota.','మెరిసే చెంబులోంచి ఏమి బయటకు వస్తుందో గీయండి.'],
 w:['Write the ending: what did Chinnu do with it?','ముగింపు రాయండి: చిన్ను దాన్ని ఏం చేశాడు?'],
 p:[['If your lota could carry one thing for our family, what would it be?','Find a brass or steel pot at home — what stories could it tell?'],['మన కుటుంబం కోసం మీ చెంబు ఒక్కటే మోయగలిగితే అది ఏమై ఉంటుంది?','ఇంట్లో ఇత్తడి లేదా స్టీలు పాత్రను వెతకండి — అది ఎన్ని కథలు చెప్పగలదు?']]},
{t:['The Dancing Shadow','నాట్యం చేసిన నీడ'],o:['Clay lamp','మట్టి ప్రమిద'],
 s:['One night the lights went out all over Pedarasi. Lachhi was scared, but Peddamma took a little clay lamp from the trunk and lit it. Tak! The flame glowed, and a big shadow appeared on the wall. It wiggled its ears like an elephant. Then — all by itself — the shadow turned, waved at Lachhi, and pointed towards the door.',
    'ఒక రాత్రి పెదరాసి ఊరంతా కరెంటు పోయింది. లచ్చికి భయమేసింది. కానీ పెద్దమ్మ పెట్టెలోంచి ఒక చిన్న మట్టి ప్రమిద తీసి వెలిగించింది. టక్! జ్వాల వెలిగింది, గోడపై పెద్ద నీడ కనిపించింది. అది ఏనుగులా చెవులు ఊపింది. అంతలో — తనంతట తానే — ఆ నీడ తిరిగి లచ్చికి చేయి ఊపి, తలుపు వైపు చూపించింది.'],
 q:['What does the shadow want to show Lachhi outside?','నీడ లచ్చికి బయట ఏమి చూపించాలనుకుంటోంది?'],
 d:['Draw the shadow and what waits outside the door.','నీడను, తలుపు బయట ఎదురుచూస్తున్నదాన్ని గీయండి.'],
 w:['Write the ending: where did the shadow lead Lachhi?','ముగింపు రాయండి: నీడ లచ్చిని ఎక్కడికి తీసుకెళ్లింది?'],
 p:[['Switch off the lights and make hand shadows together.','What shape do you think the shadow was? Why?'],['లైట్లు ఆపి కలిసి చేతి నీడలు చేయండి.','నీడ ఏ ఆకారంలో ఉందని అనుకుంటున్నారు? ఎందుకు?']]},
{t:['The Lost Wind','దారి తప్పిన గాలి'],o:['Palm-leaf fan','తాటాకు విసనకర్ర'],
 s:['It was the hottest afternoon of summer. Gopi pulled a palm-leaf fan from Peddamma’s trunk and waved it — swish! A soft breeze tickled his nose. He waved it faster — whoosh! — and a giggling wind swirled around the courtyard, tossing leaves like confetti. Then the wind whispered, “Gopi, I am lost. I cannot remember where my home is. Will you help me find it?”',
    'అది వేసవిలో అతి వేడి మధ్యాహ్నం. గోపి పెద్దమ్మ పెట్టెలోంచి ఒక తాటాకు విసనకర్ర తీసి ఊపాడు — ఫుర్ర్! మెల్లని గాలి అతని ముక్కును చక్కిలిగింతలు పెట్టింది. ఇంకా వేగంగా ఊపాడు — ఉష్! — ఒక నవ్వుల గాలి ముంగిట్లో గిరగిరా తిరుగుతూ ఆకులను చుక్కల్లా విసిరింది. అప్పుడు ఆ గాలి గుసగుసలాడింది, “గోపీ, నేను దారి తప్పిపోయాను. నా ఇల్లు ఎక్కడో గుర్తు రావడం లేదు. వెతకడంలో సాయం చేస్తావా?”'],
 q:['Where does the wind live? Who lives there with it?','గాలి ఎక్కడ ఉంటుంది? దానితో పాటు అక్కడ ఎవరు ఉంటారు?'],
 d:['Draw the wind’s home.','గాలి ఇంటిని గీయండి.'],
 w:['Write the ending: how did Gopi help the wind get home?','ముగింపు రాయండి: గాలి ఇల్లు చేరడానికి గోపి ఎలా సాయం చేశాడు?'],
 p:[['Where does a breeze come from? Let your child guess before you explain.','Wave a paper fan together and feel the wind on your cheeks.'],['గాలి ఎక్కడి నుండి వస్తుంది? మీరు వివరించే ముందు పిల్లలను ఊహించనివ్వండి.','కాగితం విసనకర్రను కలిసి ఊపి బుగ్గలపై గాలిని అనుభవించండి.']]},
{t:['The Kind-Word Seeds','మంచి మాట విత్తనాలు'],o:['Bag of seeds','విత్తనాల మూట'],
 s:['Peddamma untied a little cloth bundle. Inside were seeds no one in Pedarasi had ever seen — tiny, shiny and speckled like stars. “Plant them with a kind word,” she said. Sita dug a small hole by the tulsi plant, dropped one seed in, and whispered, “Grow well, little friend.” She watered it and went to sleep. In the morning, something green was wiggling out of the soil — and it was humming.',
    'పెద్దమ్మ ఒక చిన్న గుడ్డ మూట విప్పింది. లోపల పెదరాసిలో ఎవరూ ఎప్పుడూ చూడని విత్తనాలున్నాయి — చిన్నవిగా, మెరుస్తూ, నక్షత్రాల్లా చుక్కలతో. “మంచి మాటతో నాటండి,” అంది ఆమె. సీత తులసి మొక్క దగ్గర చిన్న గుంత తవ్వి, ఒక విత్తనం వేసి, “బాగా ఎదుగు, చిన్ని నేస్తమా,” అని గుసగుసలాడింది. నీళ్లు పోసి నిద్రపోయింది. ఉదయం చూస్తే మట్టిలోంచి ఏదో పచ్చగా మెలికలు తిరుగుతూ బయటకు వస్తోంది — అది కూనిరాగం కూడా తీస్తోంది.'],
 q:['What kind of plant grows from a seed planted with a kind word?','మంచి మాటతో నాటిన విత్తనం నుండి ఎలాంటి మొక్క పెరుగుతుంది?'],
 d:['Draw the plant that grew overnight.','ఒక్క రాత్రిలో పెరిగిన ఆ మొక్కను గీయండి.'],
 w:['Write the ending: what did the plant give Sita?','ముగింపు రాయండి: ఆ మొక్క సీతకు ఏమి ఇచ్చింది?'],
 p:[['Plant a real seed this week and say one kind word to it each day.','Ask: what do plants need to grow? What do people need?'],['ఈ వారం నిజమైన ఒక విత్తనం నాటి, రోజూ దానికి ఒక మంచి మాట చెప్పండి.','అడగండి: మొక్కలు పెరగడానికి ఏమి కావాలి? మనుషులకు ఏమి కావాలి?']]},
{t:['The Bell That Called Everyone','అందరినీ పిలిచిన గంట'],o:['Cow bell','ఆవు మెడ గంట'],
 s:['Ravi found an old bell in the trunk and rang it — clang-a-lang! Soon, from every corner of the village, animals came running: a grumpy buffalo, a clever crow, a shy squirrel and a very sleepy puppy. They all started talking at once. Peddamma raised her hand. “The bell calls everyone who has a problem,” she said. “Ravi, can you listen to each one — and find a fair answer?”',
    'రవికి పెట్టెలో ఒక పాత గంట దొరికింది. దాన్ని మోగించాడు — టణ్ణ్ టణ్ణ్! వెంటనే ఊరిలో అన్ని వైపుల నుండి జంతువులు పరుగెత్తుకొచ్చాయి: ముభావంగా ఉన్న ఒక గేదె, తెలివైన ఒక కాకి, సిగ్గరి ఉడుత, బాగా నిద్రమత్తులో ఉన్న ఒక కుక్కపిల్ల. అన్నీ ఒకేసారి మాట్లాడడం మొదలుపెట్టాయి. పెద్దమ్మ చేయి ఎత్తింది. “ఈ గంట సమస్య ఉన్న అందరినీ పిలుస్తుంది,” అంది. “రవీ, ప్రతిదాని మాటా విని, న్యాయమైన పరిష్కారం కనుక్కోగలవా?”'],
 q:['What problem could these four animals have? How would you be fair to all?','ఈ నాలుగు జంతువులకు ఏ సమస్య ఉండొచ్చు? అందరికీ న్యాయంగా ఎలా ఉంటారు?'],
 d:['Draw the animals and their problem.','ఆ జంతువులను, వాటి సమస్యను గీయండి.'],
 w:['Write the ending: how did Ravi solve it?','ముగింపు రాయండి: రవి దాన్ని ఎలా పరిష్కరించాడు?'],
 p:[['Role-play: you are the buffalo and your child is the judge. How do they decide?','Talk about a time something was not fair — what would have fixed it?'],['నటించి చూడండి: మీరు గేదె, మీ పిల్లలు న్యాయమూర్తి. వాళ్లు ఎలా తీర్పు చెప్తారు?','ఏదైనా అన్యాయం జరిగిన సందర్భం గురించి మాట్లాడండి — అది సరిదిద్దడానికి ఏం చేయవచ్చు?']]},
{t:['The Tiny-World Top','చిట్టి లోకపు బొంగరం'],o:['Wooden top','చెక్క బొంగరం'],
 s:['Chinnu wound the string around a painted wooden top and flung it on the floor. It spun… and spun… and the whole room began to shrink! The table became a mountain. A button became a round hill. And a line of ants marched past, each as tall as Chinnu. “Welcome to the Ant Village!” called the leader. “Come, our festival is about to begin!”',
    'చిన్ను రంగుల చెక్క బొంగరానికి తాడు చుట్టి నేలపైకి విసిరాడు. అది తిరిగింది… తిరిగింది… గది మొత్తం చిన్నదైపోవడం మొదలైంది! బల్ల పర్వతంలా మారింది. ఒక గుండీ గుండ్రని కొండలా అయింది. అప్పుడు చీమల వరుస నడుచుకుంటూ వచ్చింది, ప్రతి చీమా చిన్ను అంత ఎత్తు. “చీమల ఊరికి స్వాగతం!” అంది నాయకురాలు. “రండి, మా పండుగ మొదలవబోతోంది!”'],
 q:['What does a festival look like in an ant village?','చీమల ఊరిలో పండుగ ఎలా ఉంటుంది?'],
 d:['Draw the Ant Village festival.','చీమల ఊరి పండుగను గీయండి.'],
 w:['Write the ending: what did Chinnu learn from the ants?','ముగింపు రాయండి: చీమల నుండి చిన్ను ఏమి నేర్చుకున్నాడు?'],
 p:[['Lie on the grass and look at the world from an ant’s height.','What is the smallest thing in our home? Who might live there?'],['గడ్డిలో పడుకుని చీమ ఎత్తు నుండి ప్రపంచాన్ని చూడండి.','మన ఇంట్లో అతి చిన్న వస్తువు ఏది? అక్కడ ఎవరు ఉండొచ్చు?']]},
{t:['Rain That Fell Upwards','పైకి కురిసిన వాన'],o:['Umbrella','గొడుగు'],
 s:['Lachhi opened Peddamma’s big black umbrella in the courtyard — and a strange thing happened. Rain began to fall… upwards! Drops rose from the ground, sparkling, and floated into the umbrella like tiny silver fish. “Oh!” laughed Lachhi. “It is raining the wrong way!” Peddamma winked. “Look closely, child. Each drop is carrying something up to the sky.”',
    'లచ్చి ముంగిట్లో పెద్దమ్మ నల్ల గొడుగు తెరిచింది — ఒక వింత జరిగింది. వాన కురవడం మొదలైంది… పైకి! చినుకులు నేల నుండి మెరుస్తూ లేచి, చిన్న వెండి చేపల్లా గొడుగులోకి తేలిపోయాయి. “అయ్యో!” అంది లచ్చి నవ్వుతూ. “వాన తప్పుగా కురుస్తోంది!” పెద్దమ్మ కన్నుగీటింది. “బాగా చూడు, అమ్మాయీ. ప్రతి చినుకూ ఆకాశానికి ఏదో మోసుకెళ్తోంది.”'],
 q:['What could each raindrop carry up to the sky?','ప్రతి చినుకూ ఆకాశానికి ఏమి మోసుకెళ్లగలదు?'],
 d:['Draw the upside-down rain and what it carries.','తలకిందులు వానను, అది మోసుకెళ్తున్న వాటిని గీయండి.'],
 w:['Write the ending: who was waiting in the sky?','ముగింపు రాయండి: ఆకాశంలో ఎవరు ఎదురుచూస్తున్నారు?'],
 p:[['Where does rain really go after it falls? Draw the water cycle together.','What would you send up to the sky if you could?'],['కురిసిన వాన నిజంగా ఎక్కడికి వెళ్తుంది? నీటి చక్రాన్ని కలిసి గీయండి.','మీరు ఆకాశానికి ఏదైనా పంపగలిగితే ఏమి పంపుతారు?']]},
{t:['The Opposite Village','తలకిందుల ఊరు'],o:['Brass mirror','ఇత్తడి అద్దం'],

    <div class="palette">${PAL.map((p,i)=>`<button class="sw${i===0?' on':''}" data-c="${p}" style="background:${p}" aria-label="colour"></button>`).join('')}<span class="sep"></span>
     ${[5,10,20].map((z,i)=>`<button class="tool sz${i===1?' on':''}" data-z="${z}" aria-label="brush"><i class="dot" style="width:${6+i*5}px;height:${6+i*5}px"></i></button>`).join('')}
     <button class="tool" data-t="erase">${U('erase')}</button><button class="tool" data-t="undo">${U('undo')}</button><button class="tool" data-t="clear">${U('clear')}</button><button class="tool" data-t="guide">${U('guide')}</button></div>
    <div class="cvwrap" data-n="${n}"></div></section>
   <section class="card step"><span class="n">3</span><h3 class="en">${UI.s3[0]}</h3><h3 class="te">${UI.s3[1]}</h3>${T(c.w[0],c.w[1],'p','rd')}<textarea data-n="${n}" maxlength="700"></textarea></section>
  </div>
  <div class="save"><button class="cta" data-save="${n}"><span class="lbl">${U('save')}</span></button><button class="cta ghost" data-go="${2+n*2}">${U('back')}</button><span class="status"></span></div></div>`}
 if(s.t==='gal')return `<div class="gal"><div class="kick">${T('Your wonders','మీ వింతలు')}</div>${T('My creations','నా సృష్టులు','h2')}<div class="row noprint"><button class="cta" id="printg">${U('print')}</button></div><div class="gg" id="gg"></div></div>`;
 if(s.t==='fin')return `<div class="fin"><div class="pic" data-hasimg>${IM('finale','','scene')}${IM('peddamma','ped','cut')}</div><div><div class="kick">${T('The last page','చివరి పేజీ')}</div>${T('The box is empty… or is it?','పెట్టె ఖాళీ అయింది… అయిందా?','h2')}
  <div class="note rd">${T('At the very bottom lies a note in Peddamma’s handwriting: “The best wonder was never in the box. It was you.”','అడుగున పెద్దమ్మ చేతిరాతతో ఒక చీటి ఉంది: “ఈ పెట్టెలో లేని గొప్ప వింత నువ్వే.”','span')}</div>
  <div class="cert" id="cert"><div class="ct">${U('cert')}</div>${T('Little Creator','బుల్లి సృష్టికర్త','h3')}<input id="nm" maxlength="40" aria-label="name"><p class="en"><span id="cn1">0</span> wonders invented in Peddamma’s Box of Wonders</p><p class="te"><span id="cn2">0</span> వింతలను పెద్దమ్మ వింతల పెట్టెలో సృష్టించారు</p></div>
  <div class="row noprint"><button class="cta" id="printc">${U('pcert')}</button><button class="cta ghost" id="reset">${U('reset')}</button></div></div></div>`;
}
const stage=$('stage');
SC.forEach((s,i)=>{const d=document.createElement('section');d.className='scr';d.dataset.i=i;d.innerHTML=view(s);stage.appendChild(d)});
const scr=[...stage.querySelectorAll('.scr')];
/* drawing */
const cv=document.createElement('canvas');cv.width=800;cv.height=560;const cx=cv.getContext('2d');
let color=PAL[0],size=10,erase=false,hist=[],drawing=false,lx=0,ly=0,curN=-1;
function clearCv(){cx.clearRect(0,0,800,560)}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*560/r.height]}
function snap(){try{hist.push(cx.getImageData(0,0,800,560));if(hist.length>14)hist.shift()}catch(e){}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();drawing=true;[lx,ly]=pt(e);style();cx.beginPath();cx.arc(lx,ly,size/2,0,6.29);cx.fill()});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pt(e);cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(x,y);cx.stroke();lx=x;ly=y});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(drawing){drawing=false;draftSave()}}));
function style(){cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=erase?size*2.2:size;cx.globalCompositeOperation=erase?'destination-out':'source-over';cx.strokeStyle=cx.fillStyle=color}
function exportPng(w=600,h=420,white=false){const t=document.createElement('canvas');t.width=w;t.height=h;const c=t.getContext('2d');if(white){c.fillStyle='#fff';c.fillRect(0,0,w,h)}c.drawImage(cv,0,0,w,h);return t.toDataURL('image/png')}
function draftSave(){if(curN<0)return;save('d'+curN,exportPng())}
function mountCanvas(n){curN=n;const w=scr[3+n*2].querySelector('.cvwrap');
 w.innerHTML=`<div class="ghost">${OB(n)}</div>`;w.appendChild(cv);clearCv();hist=[];
 const d=load('d'+n);if(d){const im=new Image();im.onload=()=>{cx.globalCompositeOperation='source-over';cx.drawImage(im,0,0,800,560)};im.src=d}
 const ta=scr[3+n*2].querySelector('textarea');ta.value=load('t'+n)||''}
stage.addEventListener('click',e=>{
 const sw=e.target.closest('.sw');if(sw){color=sw.dataset.c;erase=false;sw.parentNode.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===sw));sw.parentNode.querySelector('[data-t=erase]').classList.remove('on');return}
 const sz=e.target.closest('.sz');if(sz){size=+sz.dataset.z;sz.parentNode.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',x===sz));return}
 const tl=e.target.closest('[data-t]');if(tl){const t=tl.dataset.t;
  if(t==='erase'){erase=!erase;tl.classList.toggle('on',erase)}
  if(t==='undo'){const h=hist.pop();if(h){cx.globalCompositeOperation='source-over';cx.putImageData(h,0,0);draftSave()}}
  if(t==='clear'){if(confirm(lang==='te'?'బొమ్మను పూర్తిగా తుడిపేయాలా?':'Clear the whole drawing?')){snap();clearCv();draftSave()}}
  if(t==='guide')tl.closest('.step').querySelector('.cvwrap').classList.toggle('noghost');return}
 const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
 const sv=e.target.closest('[data-save]');if(sv){commit(+sv.dataset.save,sv);return}
});
stage.addEventListener('input',e=>{if(e.target.matches('textarea'))save('t'+e.target.dataset.n,e.target.value)});
function commit(n,btn){draftSave();const ta=scr[3+n*2].querySelector('textarea');save('t'+n,ta.value);done[n]=true;save('done',JSON.stringify(done));paintShelf();
 const st=btn.closest('.save').querySelector('.status');st.innerHTML=U('saved');
 const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top);
 const c=Object.keys(done).length;toast(lang==='te'?`🌟 వింత పెట్టెలో చేరింది! (${c}/10)`:`🌟 Wonder added to Peddamma’s box! (${c}/10)`);
 if(!btn.parentNode.querySelector('.nx')){const b=document.createElement('button');b.className='cta nx';b.dataset.go=String(n<9?4+n*2:SC.length-2);b.innerHTML=n<9?U('nextc'):T('See my creations ›','నా సృష్టులు చూడండి ›');btn.parentNode.insertBefore(b,st)}}
/* nav */
function go(i){i=Math.max(0,Math.min(SC.length-1,i));if(curN>=0)draftSave();cur=i;scr.forEach((s,k)=>s.classList.toggle('on',k===i));const s=SC[i];
 if(s.t==='turn'){mountCanvas(s.n);const sec=scr[i];sec.querySelector('.status').innerHTML=done[s.n]?U('saved'):''}else curN=-1;
 if(s.t==='gal')paintGal();if(s.t==='fin')paintFin();
 $('prev').disabled=i===0;$('next').disabled=i===SC.length-1;paintShelf();save('cur',i);stopSpeech();window.scrollTo({top:0,behavior:'smooth'});if($('drawer').classList.contains('open'))drawer()}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('home').onclick=()=>go(0);$('mine').onclick=()=>go(SC.length-2);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function chapterOf(i){const s=SC[i];return(s.t==='story'||s.t==='turn')?s.n:-1}
function paintShelf(){const ch=chapterOf(cur);$('shelf').innerHTML=OBJ.map((o,n)=>`<button class="sl${done[n]?' done':''}${n===ch?' cur':''}" data-sh="${n}" aria-label="chapter ${n+1}">${OB(n)}</button>`).join('');$('count').textContent=Object.keys(done).length+'/10'}
$('shelf').addEventListener('click',e=>{const b=e.target.closest('[data-sh]');if(b)go(2+ +b.dataset.sh*2)});
/* gallery & finale */
function paintGal(){let h='';for(let n=0;n<10;n++){const c=CH[n];if(done[n]){const d=load('d'+n)||'',t=load('t'+n)||'';h+=`<figure><img src="${d}" alt=""><figcaption>${T(E(c.t[0]),E(c.t[1]),'b')}<p class="en">${E(t)||'—'}</p><p class="te">${E(t)||'—'}</p><button class="dl noprint" data-dl="${n}">${U('dlb')}</button></figcaption></figure>`}
 else h+=`<figure class="empty"><div class="lock">${OB(n)}</div><figcaption>${T(E(c.t[0]),E(c.t[1]),'b')}<p>${U('wait')}</p></figcaption></figure>`}
 $('gg').innerHTML=h}
$('gg').addEventListener('click',e=>{const b=e.target.closest('[data-dl]');if(!b)return;const n=+b.dataset.dl,im=new Image();im.onload=()=>{const t=document.createElement('canvas');t.width=600;t.height=420;const c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,600,420);c.drawImage(im,0,0);const a=document.createElement('a');a.download='peddamma-wonder-'+(n+1)+'.png';a.href=t.toDataURL('image/png');a.click()};im.src=load('d'+n)});
function paintFin(){const c=Object.keys(done).length;$('cn1').textContent=$('cn2').textContent=c;$('nm').value=name;$('nm').placeholder=lang==='te'?'మీ పేరు':'Your name'}
$('nm').addEventListener('input',e=>{name=e.target.value;save('name',name)});
function pr(sec){document.body.classList.add('printing');scr.forEach(s=>s.classList.remove('printme'));sec.classList.add('printme');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('printing');sec.classList.remove('printme')},300)},80)}
$('printg').onclick=()=>pr(scr[SC.length-2]);$('printc').onclick=()=>pr(scr[SC.length-1]);
$('reset').onclick=()=>{if(confirm(lang==='te'?'అన్ని సృష్టులను తొలగించి మళ్లీ మొదలుపెట్టాలా?':'Erase all creations and start over?')){try{Object.keys(localStorage).filter(k=>k.indexOf('pbw_')===0&&k!=='pbw_lang').forEach(k=>localStorage.removeItem(k))}catch(e){}done={};name='';scr.forEach(s=>{const t=s.querySelector('textarea');if(t)t.value=''});go(0)}};
/* toast, sparkles */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3400)}
function burst(x,y){const em=['✨','⭐','🌸','🪔','💛'];for(let i=0;i<14;i++){const e=document.createElement('div');e.className='spark';e.textContent=em[i%5];e.style.left=x+'px';e.style.top=y+'px';const a=Math.random()*6.28,d=60+Math.random()*120;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',(Math.sin(a)*d-50)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}
/* parents drawer */
function drawer(){const n=chapterOf(cur),te=lang==='te',li=a=>a.map(x=>`<li class="${te?'te':''}">${x}</li>`).join('');let h=`<h3 class="${te?'te':''}">${te?'తల్లిదండ్రుల మూల':'Parents’ corner'}</h3>`;
 if(n>=0){const c=CH[n],P=c.p[te?1:0];h+=`<p class="${te?'te':''}" style="margin:0;color:#8a6a24">${c.t[te?1:0]}</p><div class="kk ${te?'te':''}">${te?'కలిసి మాట్లాడుకుందాం':'Talk together'}</div><ul>${li([P[0]])}</ul><div class="kk ${te?'te':''}">${te?'ఇంట్లో చేసి చూడండి':'Try at home'}</div><div class="act"><p class="${te?'te':''}" style="margin:0">${P[1]}</p></div>`}
 h+=`<div class="kk ${te?'te':''}">${te?'కలిసి ఎలా చదవాలి':'How to guide your child'}</div><ul>${li(te?['తప్పులు సరిదిద్దకండి — మెచ్చుకోండి. “ఇంకా చెప్పు!” అని అడగండి.','ముందు పిల్లలను ఊహించనివ్వండి; జవాబు చెప్పడానికి తొందర పడకండి.','వారి బొమ్మను గోడకు తగిలించి లేదా ఇంట్లో అందరికీ చూపించండి.','పిల్లలు రాసినది, గీసినది ఈ పరికరంలో మాత్రమే ఉంటుంది; ప్రింట్ చేసి భద్రపరచుకోవచ్చు.']:['Don’t correct — celebrate. Ask: “Tell me more!”','Let your child guess first; resist the urge to give the answer.','Show their drawing to the family or pin it on the wall.','Creations are stored only on this device; print them from “My creations” to keep them.'])}</ul>`;
 $('dbody').innerHTML=h}
$('parents').onclick=()=>{const d=$('drawer');if(d.classList.contains('open'))d.classList.remove('open');else{drawer();d.classList.add('open')}};$('dclose').onclick=()=>$('drawer').classList.remove('open');
/* read aloud */
let speaking=false;function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false;$('read').classList.remove('on')}
$('read').onclick=()=>{if(!('speechSynthesis' in window)){toast('Read aloud is not supported in this browser');return}if(speaking){stopSpeech();return}
 const sec=scr[cur];let parts=[];sec.querySelectorAll('h2.'+lang+', .rd.'+lang+', .rd > .'+lang).forEach(e=>parts.push(e.textContent.trim()));const txt=parts.join('. ').replace(/\s+/g,' ');
 const vs=speechSynthesis.getVoices(),pre=lang==='te'?['te-IN','te']:['en-IN','en-GB','en-US','en'];let v=null;for(const p of pre){v=vs.find(x=>x.lang.replace('_','-').indexOf(p)===0);if(v)break}
 if(lang==='te'&&!v){toast('A Telugu voice was not found on this device. Try Chrome on Android or Windows.');return}
 const ch=txt.match(/[^.!?।]+[.!?।]?/g)||[txt];speaking=true;$('read').classList.add('on');
 ch.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c.trim());if(v)u.voice=v;u.lang=v?v.lang:'en-IN';u.rate=.88;u.pitch=1.05;if(i===ch.length-1)u.onend=()=>{speaking=false;$('read').classList.remove('on')};speechSynthesis.speak(u)})};
/* language */
function setLang(l){lang=l;document.body.classList.remove('lang-en','lang-te');document.body.classList.add('lang-'+l);document.documentElement.lang=l;
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
 scr.forEach(s=>{const t=s.querySelector('textarea');if(t){t.placeholder=UI.ph[l==='te'?1:0];t.className=l==='te'?'te':''}});
 save('lang',l);stopSpeech();if(SC[cur].t==='fin')paintFin();if($('drawer').classList.contains('open'))drawer()}
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.lang)});
/* init */
$('logo').innerHTML=ART.lota;$('logo').style.cssText='display:inline-flex;width:30px;height:30px';$('splashart').innerHTML=ART.trunk.replace('<svg','<svg class="tr"');
try{done=JSON.parse(load('done')||'{}')}catch(e){done={}}name=load('name')||'';
function begin(l,i){setLang(l);$('splash').classList.add('gone');go(i)}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>begin(b.dataset.start,0));
const sl=load('lang')==='te'?'te':'en',sc=parseInt(load('cur'))||0;
if(sc>0){const c=$('cont');c.hidden=false;c.textContent=sl==='te'?'కొనసాగించండి':'Continue where I left off';c.onclick=()=>begin(sl,sc)}
setLang(sl);go(0);
if(/^#s(\d+)$/.test(location.hash)){$('splash').classList.add('gone');go(parseInt(location.hash.slice(2)))}
window.__pbw={go,setLang,SC};
</script>
</body>
</html>
